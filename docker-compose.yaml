networks:
  reelmania-network:
    driver: bridge

services:
  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
      args:
          - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
          - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:8001}
          - VITE_VIDEO_SERVICE_URL=${VITE_VIDEO_SERVICE_URL:-http://localhost:8001}
          - VITE_USER_SERVICE_URL=${VITE_USER_SERVICE_URL:-http://localhost:8000}
          - VITE_CURATION_SERVICE_URL=${VITE_CURATION_SERVICE_URL:-http://localhost:8002}
          - VITE_VIDEO_SERVICE_PORT=${VIDEO_SERVICE_PORT:-8001}
          - VITE_VIDEO_SHARE_BASE_URL=${VITE_VIDEO_SHARE_BASE_URL:-http://localhost}
    container_name: reelmania-client
    ports:
      - "80:80"
    depends_on:
      - user-service
      - video-service
    environment:
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:8001}
      - VITE_VIDEO_SERVICE_URL=${VITE_VIDEO_SERVICE_URL:-http://localhost:8001}
      - VITE_USER_SERVICE_URL=${VITE_USER_SERVICE_URL:-http://localhost:8000}
      - VITE_CURATION_SERVICE_URL=${VITE_CURATION_SERVICE_URL:-http://localhost:8002}
      - VITE_VIDEO_SERVICE_PORT=${VIDEO_SERVICE_PORT:-8001}
      - VITE_VIDEO_SHARE_BASE_URL=${VITE_VIDEO_SHARE_BASE_URL:-http://localhost}
    networks:
      - reelmania-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: reelmania-user-service
    ports:
      - "8000:8000"
    environment:
      - USER_DATABASE_URL=${USER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/users?schema=public}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT:-8000}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - reelmania-network

  video-service:
    build:
      context: ./backend/video-service
      dockerfile: Dockerfile
    container_name: reelmania-video-service
    ports:
      - "8001:8001"
    environment:
      - VIDEO_DATABASE_URL=${VIDEO_DATABASE_URL:-mongodb://mongodb:27017/videos?replicaSet=rs0}
      - VIDEO_SERVICE_PORT=${VIDEO_SERVICE_PORT:-8001}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - ACTIVE_STORAGE_PROVIDER=${ACTIVE_STORAGE_PROVIDER:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-http://localhost:9000/videos}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-videos}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_REGION=${S3_REGION:-us-east-1}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - SOCKET_PATH=${SOCKET_PATH:-/socket.io/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - mongodb
      - minio
      - redis
      - rabbitmq
    networks:
      - reelmania-network

  curation-service:
    build:
      context: ./backend/curation-service
      dockerfile: Dockerfile
    container_name: reelmania-curation-service
    ports:
      - "8002:8002"
    environment:
      # The `curation` database is auto-created by `prisma db push` on start
      # (it lives in the shared Postgres instance alongside `users`).
      - CURATION_DATABASE_URL=${CURATION_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/curation?schema=public}
      - CURATION_SERVICE_PORT=${CURATION_SERVICE_PORT:-8002}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
      # Internal hostname for batched video hydration (sync REST, fail-soft).
      - VIDEO_SERVICE_INTERNAL_URL=${VIDEO_SERVICE_INTERNAL_URL:-http://video-service:8001}
    depends_on:
      - postgres
      - rabbitmq
      - video-service
    networks:
      - reelmania-network

  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: reelmania-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reelmania-network

  mongodb:
    image: mongo:6
    container_name: reelmania-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - reelmania-network

  mongodb-setup:
    image: mongo:6
    container_name: reelmania-mongodb-setup
    depends_on:
      - mongodb
    networks:
      - reelmania-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mongosh --host mongodb:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]})' || true;
      exit 0;
      "

  minio:
    image: minio/minio
    container_name: reelmania-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - reelmania-network

  minio-setup:
    image: minio/mc
    container_name: reelmania-minio-setup
    depends_on:
      - minio
    networks:
      - reelmania-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/videos --ignore-existing;
      /usr/bin/mc anonymous set download myminio/videos;
      exit 0;
      "

  redis:
    image: redis:7-alpine
    container_name: reelmania-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reelmania-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: reelmania-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - reelmania-network

volumes:
  postgres_data:
  mongodb_data:
  minio_data:
  redis_data:
  rabbitmq_data: